  - id: typograph-settings
    title: Typograph Settings
    title.zh: 排版设置
    type: heading
    level: 2
    collapsed: true
  - id: file-line-width
    title: Content Area width
    title.zh: 内容区域宽度
    description: The maximum line width
    description.zh: 最大行宽
    type: variable-number-slider
    default: 700
    min: 420
    max: 1200
    format: px
    step: 1
  - id: callout-setting
    title: Callout
    title.zh: Callout
    type: heading
    level: 3
    collapsed: true
  - id: callout-style
    title: Callout Style
    title.zh: Callout 样式
    description: Choose prefered Callout style
    description.zh: 选择喜欢的 Callout 风格
    type: class-select
    allowEmpty: false
    default: yaobian--DefaultCalloutStyle
    options:
      - label: Default 默认
        value: yaobian--DefaultCalloutStyle
      - label: Subtle Grid 渐隐网格
        value: yaobian--SubtleGridCallout
      - label: Clean Line 简洁线条
        value: yaobian--CleanLineCallout
      - label: Github Style
        value: yaobian--GithubCallout
      - label: Window Panel 窗格
        value: yaobian--WindowPanelCallout
  - id: typograph-paragraph
    title: Paragraph
    title.zh: 段落
    type: heading
    level: 3
    collapsed: true
  - id: yaobian--ParagraphIndent
    title: Paragraph Indent
    title.zh: 段落首行缩进
    description: indent the first line of a paragraph
    description.zh: 段落首行自动缩进 2 个字符
    type: class-toggle
  - id: paragraph-line-height
    title: Paragraph Line Height
    title.zh: 段落行高
    description: Set the line height of the paragraph
    description.zh: 设置段落的行高
    type: variable-number
    default: 1.7
    min: 1.2
    max: 2.5
  - id: paragraph-letter-spacing
    title: Paragraph Letter Spacing
    title.zh: 段落字间距
    description: Set the letter spacing of the paragraph, you should specify the unit em or px
    description.zh: 设置段落的字间距，需要指定单位 em 或 px
    type: variable-text
    default: 0.035em
  - id: paragraph-word-spacing
    title: Paragraph Word Spacing
    title.zh: 段落词间距
    description: Set the word spacing of the paragraph, you should specify the unit em or px
    description.zh: 设置段落的词间距，需要指定单位 em 或 px
    type: variable-text
    default: 0.035em

  - id: bold-style-setting
    title: Bold
    title.zh: 加粗
    type: heading
    level: 3
    collapsed: true
  - id: bold-color
    title: Bold Color
    title.zh: 加粗颜色
    type: variable-themed-color
    format: hex
    default-light: "#2d3748"
    default-dark: "#f0f4f8"
  - id: bold-modifier
    title: Bold Weight
    title.zh: 加粗粗细
    type: variable-number
    default: 200
  - id: italic-style-setting
    title: Italic
    title.zh: 斜体
    type: heading
    level: 3
    collapsed: true
  - id: italic-color
    title: Italic Color
    title.zh: 斜体颜色
    type: variable-themed-color
    format: hex
    default-light: "#2d3748"
    default-dark: "#f0f4f8"
  - id: task-setting
    title: Task Settings
    title.zh: 任务
    type: heading
    level: 3
    collapsed: true
  - id: yaobian--RemoveTaskCompletedDecoration
    title: Remove Task Completed Decoration
    title.zh: 移除任务完成装饰
    description: Remove the strikethrough for completed tasks
    description.zh: 移除完成任务的划线
    type: class-toggle

  - id: inline-code-style-setting
    title: Inline Code Style
    title.zh: 内联代码
    type: heading
    level: 3
    collapsed: true
  - id: inline-code-normal
    title: Inline Code Text Color
    title.zh: 内联代码文本色
    type: variable-themed-color
    format: hex
    default-light: "#eb5757"
    default-dark: "#ff7b72"
  - id: inline-code-background
    title: Inline Code Background Color
    title.zh: 内联代码背景色
    type: variable-themed-color
    format: hsl
    default-light: "hsla(31, 41%, 90%, 0.6)"
    default-dark: "hsla(204, 15%, 25%, 0.4)"

  - id: layout-settings
    title: Layout Settings
    title.zh: 布局设置
    type: heading
    level: 2
    collapsed: true
  - id: yaobian--DisableNavHeaderAutoHide
    title: Disable Nav Header Auto Hide
    title.zh: 关闭自动隐藏导航栏
    description: Enable this option to disable the auto-hide of the nav header
    description.zh: 启用以后，相关视图的导航栏将会常驻（比如文件列表、标签、目录栏的导航栏菜单），不会在失去焦点时自动隐藏
    type: class-toggle
  - id: yaobian--DisableFileFolderIcon
    title: Disable File Folder Icon
    title.zh: 禁用目录列表文件夹图标
    type: class-toggle
  - id: yaobian--EnableIndentationGuidLine
    title: Enable Indentation Guide Line
    title.zh: 启用缩进指导线
    description: show indentation guide line for file tree, ordered list, unordered list, and task list
    description.zh: 显示文件树、有序列表、无序列表和任务列表的缩进指导线
    type: class-toggle
  - id: modal-bg-blur
    title: Modal Backdrop Blur Intensity
    title.zh: 模态框背景模糊强度
    type: variable-number-slider
    default: 3
    min: 0
    max: 10
    step: 1
    format: px
  - id: yaobian--ToggleDesktopViewHeaderTitleParent
    title: Toggle Desktop View Header Title Parent
    title.zh: 桌面端视图标题路径折叠
    type: class-toggle
    default: true
  - id: nav-file-settings
    title: Nav File Settings
    title.zh: 导航文件
    type: heading
    level: 3
    collapsed: true
  - id: yaobian--EnableFilenameLineFeed
    title: Enable Filename Line Feed
    title.zh: 启用文件名换行
    description: enable line feed for filename
    description.zh: 文件名换行显示
    type: class-toggle
  - id: yaobian--EnableHiddenFileTag
    title: Enable Hidden File Tag
    title.zh: 启用隐藏文件标签
    description: enable hidden file tag
    description.zh: 隐藏文件后缀标签
    type: class-toggle
  - id: yaobian--EnableHiddenFileTagHover
    title: Enable Hidden File Tag Hover
    title.zh: 文件标签悬停显示
    description: enable hidden file tag hover
    description.zh: 文件后缀标签鼠标悬停显示
    type: class-toggle
  - id: outline-settings
    title: Outline Settings
    title.zh: 大纲
    type: heading
    level: 3
    collapsed: true
  - id: outline-style
    title: Outline Style
    title.zh: 大纲样式
    description: Choose prefered outline style
    description.zh: 选择大纲的样式
    type: class-select
    allowEmpty: false
    default: yaobian--DefaultOutlineStyle
    options:
      - label: Default 默认
        value: yaobian--DefaultOutlineStyle
      - label: Node 节点
        value: yaobian--NodeOutlineStyle
  - id: outline-collapsed-icon-opacity
    title: Outline Collapsed Icon Opacity
    title.zh: 大纲折叠图标透明度
    description: Set the opacity of the collapsed icon
    description.zh: 设置折叠图标的透明度
    type: variable-number-slider
    default: 1
    min: 0
    max: 1
    step: 0.1
